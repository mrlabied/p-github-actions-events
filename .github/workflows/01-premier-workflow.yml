name: information workflow
 
on: push
 
jobs:
  dire-bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: Afficher les détails
        run: |
          echo "Bonjour depuis GitHub Actions !"
          echo "Événement : ${{ github.event_name }}"
          echo "Déclenché par : ${{ github.actor }}"
          echo "Dépôt : ${{ github.repository }}"
          echo "Référence : ${{ github.ref }}"


